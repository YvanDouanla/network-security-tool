services:
  api:
    image: network-security-tool-api:after
    build:
      context: .
      dockerfile: api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - api
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true
