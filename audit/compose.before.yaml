services:
  api:
    image: network-security-tool-api:before
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend

  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
